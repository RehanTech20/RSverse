<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSverse — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0714;
        color: #f4f1ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #130f24;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0 0 20px;
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #f43f5e, #7c3aed);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>RSverse is Offline</h1>
      <p>Your network connection dropped. Reconnect to sync rooms, live games, and private chat with your partner.</p>
      <button onclick="window.location.reload()">Try Reconnecting</button>
    </main>
  </body>
</html>
